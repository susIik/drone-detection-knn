services:
  panns:
    image: panns
    build: ./ml
    ports:
      - "5002:5002"
  
  backend:
    image: backend
    build: ./server
    ports:
      - "5001:5001"
    depends_on:
      - panns

  #frontend:
  #  image: frontend
  #  build: ./client
  #  ports:
  #    - "3000:3000"

  listener:
    image: listener
    build: ./scripts
    devices:
      - "/dev/snd:/dev/snd"
    ports:
      - "8080:8080"
    depends_on:
      - backend